{% extends "base.html" %}
{% block title %}Role Assignments{% endblock %}
{% block content %}
    <h1 class="text-3xl font-bold text-gray-300 mb-6"><i class="fas fa-user-shield mr-2 text-cyan-400"></i> Role Assignments</h1>
    
    <!-- Loading State -->
    <div id="loading-state" class="bg-gray-700 rounded-lg shadow-lg p-6">
        <div class="flex items-center justify-center">
            <svg class="animate-spin -ml-1 mr-3 h-8 w-8 text-cyan-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <div class="text-center">
                <p class="text-cyan-400 text-lg font-semibold">Fetching Role Assignments...</p>
                <p class="text-gray-400 text-sm mt-1">⏱️ This may take 10-30 seconds in larger environments</p>
                <p id="loading-progress" class="text-gray-400 text-sm mt-1">📊 Checking permissions...</p>
            </div>
        </div>
    </div>

    <!-- Content State -->
    <div id="content-state" class="bg-gray-700 rounded-lg shadow-lg p-6 hidden">
        <div id="role-assignments-content">
            <!-- Content will be loaded here -->
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const loadingState = document.getElementById('loading-state');
            const contentState = document.getElementById('content-state');
            const loadingProgress = document.getElementById('loading-progress');
            const contentDiv = document.getElementById('role-assignments-content');

            // Show progress updates
            let progressCounter = 0;
            const progressMessages = [
                '📊 Checking permissions...',
                '🔍 Discovering role assignments...',
                '📈 Processing data...',
                '⏳ Finalizing results...'
            ];

            const progressInterval = setInterval(() => {
                progressCounter = (progressCounter + 1) % progressMessages.length;
                loadingProgress.textContent = progressMessages[progressCounter];
            }, 2000);

            // Fetch role assignments
            fetch('/get_role_assignments')
                .then(response => response.json())
                .then(data => {
                    clearInterval(progressInterval);
                    
                    if (data.role_assignments !== undefined) {
                        // Hide loading, show content
                        loadingState.classList.add('hidden');
                        contentState.classList.remove('hidden');
                        
                        if (data.role_assignments.length > 0) {
                            // Build table HTML
                            let tableHTML = `
                                <table class="w-full text-left">
                                    <thead>
                                        <tr class="bg-blue-600 text-white">
                                            <th class="p-4">Role Name</th>
                                            <th class="p-4">Scope</th>
                                            <th class="p-4">Capabilities</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                            `;
                            
                            data.role_assignments.forEach(assignment => {
                                const capabilities = assignment.capabilities || [];
                                const capabilitiesHTML = capabilities.length > 0 
                                    ? `<ul class="list-disc list-inside">${capabilities.map(cap => `<li>${cap}</li>`).join('')}</ul>`
                                    : 'N/A';
                                
                                tableHTML += `
                                    <tr class="border-b border-gray-600 hover:bg-gray-600">
                                        <td class="p-4 text-gray-300">${assignment.roleDefinitionName || 'Unknown Role'}</td>
                                        <td class="p-4 text-gray-400">${assignment.scope || 'N/A'}</td>
                                        <td class="p-4 text-gray-400">${capabilitiesHTML}</td>
                                    </tr>
                                `;
                            });
                            
                            tableHTML += `
                                    </tbody>
                                </table>
                            `;
                            
                            contentDiv.innerHTML = tableHTML;
                        } else {
                            contentDiv.innerHTML = '<p class="text-gray-400">No role assignments found. Please ensure you are authenticated with \'az login\'.</p>';
                        }
                    } else if (data.error) {
                        clearInterval(progressInterval);
                        loadingState.classList.add('hidden');
                        contentState.classList.remove('hidden');
                        contentDiv.innerHTML = `<p class="text-red-400">Error loading role assignments: ${data.error}</p>`;
                    }
                })
                .catch(error => {
                    clearInterval(progressInterval);
                    console.error('Error fetching role assignments:', error);
                    loadingState.classList.add('hidden');
                    contentState.classList.remove('hidden');
                    contentDiv.innerHTML = '<p class="text-red-400">Error loading role assignments. Please try again.</p>';
                });
        });
    </script>
{% endblock %}
